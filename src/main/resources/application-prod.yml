spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${AES_GCM_KEY}
  security:
    email-otp:
      hmac-secret: ${OTP_HMAC_SECRET}

server:
  forward-headers-strategy: framework
